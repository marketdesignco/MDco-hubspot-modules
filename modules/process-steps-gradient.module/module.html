{% require_css %}
<style>
  {% scope_css %}
  .process-steps-gradient {
    {{ module.style.spacing_desktop.css }};
  }
  @media (max-width: 991px) {
    .process-steps-gradient {
      {{ module.style.spacing_mobile.css }};
    }
  }
  {% end_scope_css %}
</style>
{% end_require_css %}
<section class="process-steps-gradient"{% if module.section_id %} id="{{ module.section_id }}"{% endif %}>
  <div class="content-wrapper">
    <div class="process-steps-gradient__intro">
      {% if module.eyebrow %}<div class="process-steps-gradient__eyebrow">{{ module.eyebrow }}</div>{% endif %}
      <div class="process-steps-gradient__heading">{{ module.heading }}</div>
      {% if module.lede %}<div class="process-steps-gradient__lede">{{ module.lede }}</div>{% endif %}
    </div>
    <div class="process-steps-gradient__steps">
      {% for step in module.steps %}
      <div class="process-steps-gradient__step">
        <div class="process-steps-gradient__step-head">
          <span class="process-steps-gradient__number process-steps-gradient__number--{{ step.gradient_style }}">{{ step.number }}</span>
          <span class="process-steps-gradient__title">{{ step.title }}</span>
        </div>
        <div class="process-steps-gradient__desc">{{ step.description }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
