{% require_css %}
<style>
  {% scope_css %}
  .signals-section{

    background:{{ module.style.background_color.color }};
    {{ module.style.spacing_desktop.css }}
  }
  @media (max-width:768px){
    .signals-section{
      {{ module.style.spacing_mobile.css }}
    }
  }
  {% end_scope_css %}
</style>
{% end_require_css %}
<section class="signals-section" {% if module.id_section  %}id="{{ module.id_section }}"{% endif %}>
  <div class="content-wrapper">

    <div class="signals-caption">
      {{ module.caption }}
    </div>

    <div class="signals-heading">
      {{ module.heading }}
    </div>

    <div class="signals-intro">
     {{ module.description }}
    </div>

    <div class="signals-grid">
      {% for card in module.cards %}
        <div class="signals-card {{ card.color }}">

          <h5 class="signals-card-label">
            {{ card.title }}
          </h5>

          <div class="signals-card-subtitle">
            {{ card.text }}
          </div>

          {% if card.quotes %}
            <div class="signals-quotes">
              {% for quote in card.quotes %}
                <figure class="signals-quote">
                  <div class="signals-quote-text">
                    {{ quote.text }}
                  </div>

                  <figcaption class="signals-quote-author">
                    {{ quote.author }}
                  </figcaption>
                </figure>
              {% endfor %}
            </div>
          {% endif %}

        </div>
      {% endfor %}
    </div>

  </div>
</section>
