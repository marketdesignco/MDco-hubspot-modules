{% require_css %}
<style>
  {% scope_css %}
  .audience-grid {
    {{ module.style.spacing_desktop.css }};
  }
  @media (max-width: 991px) {
    .audience-grid {
      {{ module.style.spacing_mobile.css }};
    }
  }
  {% end_scope_css %}
</style>
{% end_require_css %}
<section class="audience-grid"{% if module.section_id %} id="{{ module.section_id }}"{% endif %}>
  <div class="content-wrapper">
    <div class="audience-grid__intro">
      {% if module.eyebrow %}<div class="audience-grid__eyebrow">{{ module.eyebrow }}</div>{% endif %}
      <div class="audience-grid__heading">{{ module.heading }}</div>
      {% if module.lede %}<div class="audience-grid__lede">{{ module.lede }}</div>{% endif %}
    </div>
    <div class="audience-grid__grid">
      {% for card in module.cards %}
      <article class="audience-grid__card audience-grid__card--{{ card.layout_width }}">
        {% if card.tag %}<span class="audience-grid__tag">{{ card.tag }}</span>{% endif %}
        <div class="audience-grid__card-title">{{ card.title }}</div>
        <div class="audience-grid__card-desc">{{ card.description }}</div>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
