{% require_css %}
<style>
  {% scope_css %}
  .credential-grid {
    background-color: {{ module.style.background_color.color }};
    {{ module.style.spacing_desktop.css }};
  }
  @media (max-width: 991px) {
    .credential-grid {
      {{ module.style.spacing_mobile.css }};
    }
  }
  {% end_scope_css %}
</style>
{% end_require_css %}
<section class="credential-grid"{% if module.section_id %} id="{{ module.section_id }}"{% endif %}>
  <div class="content-wrapper">
    <div class="credential-grid__intro">
      {% if module.eyebrow %}<div class="credential-grid__eyebrow">{{ module.eyebrow }}</div>{% endif %}
      <div class="credential-grid__heading">{{ module.heading }}</div>
      {% if module.lede %}<div class="credential-grid__lede">{{ module.lede }}</div>{% endif %}
    </div>
    <div class="credential-grid__grid">
      {% for card in module.cards %}
      <div class="credential-grid__card">
        <div class="credential-grid__badge{% if card.badge_gradient %} credential-grid__badge--gradient{% endif %}" style="{% if not card.badge_gradient %}background:{{ card.badge_bg.color }};{% endif %} color:{{ card.badge_text_color.color }};">{{ card.badge_text }}</div>
        <div class="credential-grid__card-title">{{ card.title }}</div>
        <div class="credential-grid__card-desc">{{ card.description }}</div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
