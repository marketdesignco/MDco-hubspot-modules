{% require_css %}
<style>
  {% scope_css %}
  .ff-people {
    background: {{ module.style.background_color.color }};
    color: {{ module.style.text_color.color }};
    {{ module.style.spacing_desktop.css }}
  }
  @media (max-width: 768px) { .ff-people { {{ module.style.spacing_mobile.css }} } }
  {% if module.style.bullet_color.color and module.style.bullet_color.color|lower != "#f72585" %}
  .ff-people-checklist li::before { color: {{ module.style.bullet_color.color }}; }
  {% endif %}
  {% if module.style.checklist_emphasis_color.color and module.style.checklist_emphasis_color.color|lower != "#3a0ca3" %}
  .ff-people-checklist li strong { color: {{ module.style.checklist_emphasis_color.color }}; }
  {% endif %}
  {% end_scope_css %}
</style>
{% end_require_css %}

<section class="ff-people"{% if module.section_id %} id="{{ module.section_id }}"{% endif %}>
  <div class="ff-wrap">
    {% if module.eyebrow %}<div class="ff-eyebrow"><span>{{ module.eyebrow }}</span></div>{% endif %}
    {{ module.heading }}
    <div class="ff-people-grid">
      <div>{{ module.lede }}</div>
      <ul class="ff-people-checklist">
        {% for item in module.checklist %}<li>{{ item.html }}</li>{% endfor %}
      </ul>
    </div>
  </div>
</section>
