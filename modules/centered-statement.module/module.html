{% require_css %}
<style>
  {% scope_css %}
  .centered-statement {
    {{ module.style.spacing_desktop.css }};
  }
  @media (max-width: 991px) {
    .centered-statement {
      {{ module.style.spacing_mobile.css }};
    }
  }
  {% end_scope_css %}
</style>
{% end_require_css %}
<section class="centered-statement"{% if module.section_id %} id="{{ module.section_id }}"{% endif %}>
  <div class="content-wrapper centered-statement__inner">
    {% if module.eyebrow %}<div class="centered-statement__eyebrow">{{ module.eyebrow }}</div>{% endif %}
    <div class="centered-statement__heading">{{ module.heading }}</div>
    {% if module.description %}<div class="centered-statement__description">{{ module.description }}</div>{% endif %}
    {% if module.show_accent_bar %}<div class="centered-statement__bar"></div>{% endif %}
  </div>
</section>
