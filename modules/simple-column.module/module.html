{% require_css %}
<style>
	{% scope_css %}
  .mdcompass-mortar{
 
    background:{{ module.style.background_color.color }};
     {{ module.style.spacing_desktop.css }}
  }
  @media (max-width:768px){
     .mdcompass-mortar{
  {{ module.style.spacing_mobile.css }}
  }
  }
	{% end_scope_css %}
</style>
{% end_require_css %}

<section class="mdcompass-mortar" id="{{ module.id_section }}">
  <div class="mdcompass-mortar__container content-wrapper">

    <!-- Columna izquierda -->
    <div class="mdcompass-mortar__intro">
      <div class="mdcompass-mortar__eyebrow">
        {{ module.badge_text }}
      </div>

      <div class="mdcompass-mortar__title">
      {{ module.heading }}
      </div>

      <div class="mdcompass-mortar__statement">
       {{ module.description }}
      </div>
    </div>

    <!-- Columna derecha -->
    <div class="mdcompass-mortar__body">
      {{ module.quote }}
    </div>

  </div>
</section>
